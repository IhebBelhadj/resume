[project]
name = "resume-pipeline"
version = "0.1.0"
description = "Tailored resume generation from a structured context knowledge base"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 3 (automation) — not used yet
automation = ["prefect>=3", "anthropic", "trafilatura"]

[tool.setuptools]
packages = ["pipeline", "pipeline.core", "pipeline.flows"]
