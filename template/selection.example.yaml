# selection.yaml — what to show for this offer. References context/ by id only.
# Validate + build: .venv/bin/python -m pipeline build offers/<slug>

offer:                      # metadata, not rendered
  company:
  role:
  url:

max_pages: 1
# sections: [summary, skills, experience, projects, education]   # optional order override

# Must-have terms from the offer; `build` reports which ones appear in the PDF text.
keywords: []

# A summary id from context/profile.yaml, or {id: <base id>, text: "..."} to reword it.
summary: sum-backend-data-ai

skills:                     # categories from context/skills.yaml; items may be subset/reordered/regrouped
  - category: languages
    items: [TypeScript, Python]
  # - {category: infra, label: "Infrastructure & DevOps", items: [Docker, Kubernetes]}

experiences:                # rendered newest-first automatically
  - id: talan-data-consultant
    # title: <one of the experience's `titles`>      (default: first)
    bullets:                # bullet ids, or {id, text} for a rewording (reported for review)
      - tdc-dbt-snowflake-migration
    # stack: true | false | [subset or ordered list]  (default: full stack)

projects:                   # rendered in this order (most relevant first)
  - id: opsforge
    bullets: [of-desc]
    # stack: true

education: [esprit-master, ipeim-prepa]
